name: 🔄 Update README with Exercism Solutions

on:
  # Run automatically once a day
  schedule:
    - cron: '0 0 * * *'

  # Run whenever you push to main (useful after manually adding exercises)
  push:
    branches: [main]

  # Let you trigger it manually from the Actions tab anytime
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the README change back

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🚀 Run update script
        run: python scripts/update_readme.py
        env:
          EXERCISM_TOKEN: ${{ secrets.EXERCISM_TOKEN }}

      - name: 📝 Commit & push if README changed
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "chore: sync Exercism solutions [skip ci]"
          git push
